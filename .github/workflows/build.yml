# SPDX-License-Identifier: MPL-2.0
# FM-1 CRAFT: built from source on GitHub by the shared FM-1 builder (zvenson/fm1-build), after CTL-1's release.yml.
# Actions > "Build firmware" > Run workflow: the package is in the run's "packages" artifact (craft.fwsc).
# Every push to main builds too. A pushed tag vX.Y also makes a release with it.
name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: craft-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: false        # a failing simulator check does not stop the package
      build: |
        set -euo pipefail
        pkg=craft
        sudo apt-get install -y -qq libfribidi0
        mkdir -p build/release-assets
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version=${GITHUB_REF_NAME#v}
          ./build.sh --release "$version"
          cp "app/build/$pkg-$version.fwsc" build/release-assets/
          cp "app/build/$pkg.bin" "build/release-assets/$pkg-$version-app.bin"
        else
          ./build.sh
          cp "app/build/$pkg.fwsc" build/release-assets/
          cp "app/build/$pkg.bin" "build/release-assets/$pkg-app.bin"
        fi
      test: |
        st=0
        sh tests/run_tests.sh > build/release-assets/simulator.log 2>&1 || st=$?
        cat build/release-assets/simulator.log
        cp app/build/host/*.png build/release-assets/ 2>/dev/null || true
        exit $st
      packages: build/release-assets/*
